spring.application.name=lyzer-recime

# --- Datasource -------------------------------------------------------------
# Defaults match compose.yaml; every value is env-overridable so no credential
# is baked into an artifact.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recime}
spring.datasource.username=${DB_USER:recime}
spring.datasource.password=${DB_PASSWORD:recime}

# --- JPA --------------------------------------------------------------------
# validate: Hibernate asserts the entity mapping matches the Flyway-built schema
# and refuses to start on drift. Never `update` — it silently mutates schemas.
spring.jpa.hibernate.ddl-auto=validate

# Off explicitly. With open-in-view on, a missing fetch join hides behind a lazy
# load in the serializer; with it off it fails loudly as
# LazyInitializationException — in a test, not in production.
spring.jpa.open-in-view=false

# --- Paging -----------------------------------------------------------------
# max-page-size caps ?size=100000. Deliberately NO default-page-size:
# @PageableDefault on the controller method wins over it, so setting both gives
# a documented default of 20 and an actual default of 10. max-page-size is
# applied outside that branch, so it still takes effect.
spring.data.web.pageable.max-page-size=100

# --- OpenAPI ----------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
