services:
  postgres:
    image: postgres:14.17
    container_name: lyzer-recime-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recime}
      POSTGRES_USER: ${POSTGRES_USER:-recime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recime}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recime} -d ${POSTGRES_DB:-recime}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
